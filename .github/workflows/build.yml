name: build-aix
on:
  push:
    paths: ["src/**", ".github/workflows/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sumber extension
        uses: actions/checkout@v4
        with:
          path: ours

      - name: Java 8 (sesuai extension-template)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install ant + git
        run: sudo apt-get update && sudo apt-get install -y ant git

      - name: Clone extension-template (+submodule deps)
        run: git clone --recurse-submodules https://github.com/mit-cml/extension-template.git template

      - name: Salin sumber ke template
        run: cp -r ours/src/* template/src/

      - name: Precompile enum Options (agar terbaca annotation processor)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/prebuilt"
          javac -source 7 -target 7 -encoding utf-8 -cp "$GITHUB_WORKSPACE/template/lib/appinventor/*:$GITHUB_WORKSPACE/template/lib/deps/*" -d "$GITHUB_WORKSPACE/prebuilt" "$GITHUB_WORKSPACE/ours/src/com/norvex/chatbot/Resolution.java"
          cd "$GITHUB_WORKSPACE/prebuilt" && jar cf "$GITHUB_WORKSPACE/template/lib/deps/norvex-options.jar" com/norvex/chatbot/Resolution*.class

      - name: Build .aix
        run: |
          cd template
          set -o pipefail
          ant extensions 2>&1 | tee ../build.log

      - name: Upload log bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload artefak .aix
        uses: actions/upload-artifact@v4
        with:
          name: Tools_Chatbot-aix
          path: template/out/*.aix
